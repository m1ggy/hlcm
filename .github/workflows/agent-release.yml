name: Desktop tracker release

# Builds the Carenela desktop app (desktop/) for Windows and Mac, attaches
# the installers to a GitHub Release, and publishes them to the prod
# bucket's agent-releases/ folder, where the download page and the apps'
# auto-update find them (scripts/upload-agent-release.sh, through the
# droplet — same DROPLET_* secrets as deploy.yml).
#
# Start it by pushing a tag that matches desktop/package.json's version:
#   git tag agent-v0.3.1 && git push origin agent-v0.3.1
# or run it by hand from the Actions tab (builds only, no Release, unless a
# tag is given).
#
# The app asks for the workspace at sign-in (config.json rootDomain).
# Builds are unsigned by decision (no certificates).

on:
  push:
    tags: ["agent-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: desktop
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows
            runner: windows-latest
            script: dist:win
          - os: mac
            runner: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.runner }}
    env:
      # Unsigned builds: stop electron-builder looking for certificates.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/agent-v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "agent-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match desktop/package.json version $version. Bump the version or fix the tag."
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: tracker-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/release/Carenela-*
            desktop/release/latest*.yml

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/agent-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create release
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la
          version="${GITHUB_REF_NAME#agent-v}"
          cat > notes.md <<EOF
          Carenela desktop app $version (unsigned build).

          Files:
          - Windows: \`Carenela-Setup-$version.exe\`
          - Mac, Apple chip: \`Carenela-$version-arm64.dmg\`
          - Mac, Intel: \`Carenela-$version-x64.dmg\`

          Published to the bucket's \`agent-releases/\` folder by the next job;
          the download page and the apps' auto-update pick it up from there.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Carenela desktop app $version" \
            --notes-file notes.md \
            Carenela-* latest*.yml

  publish:
    name: Publish to agent-releases/
    needs: release
    runs-on: ubuntu-latest
    # Only the upload script is checked out, so there's no desktop/ to run in.
    defaults:
      run:
        working-directory: .
    env:
      DEPLOY_PATH: ${{ secrets.DROPLET_DEPLOY_PATH || '/opt/hclm-app' }}
      SSH_PORT: ${{ secrets.DROPLET_SSH_PORT || 22 }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/upload-agent-release.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Trust droplet host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      # Installers first, latest*.yml last, so no app sees a version before
      # its files exist.
      - name: Upload
        run: bash scripts/upload-agent-release.sh release "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}"
