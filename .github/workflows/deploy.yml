name: Deploy

# Env resolution:
#   push to `dev`  -> dev
#   push to `main` -> production
#   workflow_dispatch -> pick any environment (e.g. a newly added one)
#
# Each environment name below must exist under Settings > Environments in
# GitHub, with its own DROPLET_HOST / DROPLET_USER / DROPLET_SSH_KEY /
# DROPLET_SSH_PORT / DROPLET_DEPLOY_PATH secrets. To add another environment
# (e.g. "staging"): create the GitHub Environment + secrets, add its branch to
# the `push.branches` list (it'll resolve to an environment of the same name
# via the `else` branch below), and add it to workflow_dispatch's `options`
# for manual triggering.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        required: true
        options: [dev, production]

permissions:
  contents: read
  packages: write

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - id: resolve
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: resolve-environment
    runs-on: ubuntu-latest
    outputs:
      image_base: ${{ steps.vars.outputs.image_base }}
      env_tag: ${{ steps.vars.outputs.env_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: vars
        env:
          ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}
        run: |
          echo "image_base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "env_tag=${ENVIRONMENT}-$(echo '${{ github.sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.vars.outputs.image_base }}:${{ needs.resolve-environment.outputs.environment }}-latest
            ${{ steps.vars.outputs.image_base }}:${{ steps.vars.outputs.env_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ steps.vars.outputs.image_base }}:migrate-${{ needs.resolve-environment.outputs.environment }}-latest
            ${{ steps.vars.outputs.image_base }}:migrate-${{ steps.vars.outputs.env_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [resolve-environment, build-and-push]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.environment }}
    env:
      DEPLOY_PATH: ${{ secrets.DROPLET_DEPLOY_PATH || '/opt/hclm-app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Trust droplet host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DROPLET_SSH_PORT || 22 }}" -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync compose files to droplet
        run: |
          ssh -p "${{ secrets.DROPLET_SSH_PORT || 22 }}" "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "mkdir -p '${{ env.DEPLOY_PATH }}'"
          scp -P "${{ secrets.DROPLET_SSH_PORT || 22 }}" docker-compose.yml Caddyfile \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:${{ env.DEPLOY_PATH }}/"

      - name: Deploy on droplet
        env:
          IMAGE_BASE: ${{ needs.build-and-push.outputs.image_base }}
          ENV_TAG: ${{ needs.resolve-environment.outputs.environment }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          ssh -p "${{ secrets.DROPLET_SSH_PORT || 22 }}" "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "IMAGE_BASE='$IMAGE_BASE' ENV_TAG='$ENV_TAG' GH_TOKEN='$GH_TOKEN' GH_ACTOR='$GH_ACTOR' DEPLOY_PATH='${{ env.DEPLOY_PATH }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          touch .env
          for kv in "APP_IMAGE=${IMAGE_BASE}:${ENV_TAG}-latest" "MIGRATOR_IMAGE=${IMAGE_BASE}:migrate-${ENV_TAG}-latest"; do
            key="${kv%%=*}"
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${kv}|" .env
            else
              echo "$kv" >> .env
            fi
          done

          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

          docker compose pull app
          docker compose --profile tools pull migrate
          docker compose --profile tools run --rm -T migrate < /dev/null
          docker compose up -d app caddy postgres
          # -a also clears out the previous deploy's now-unused tagged
          # images (each deploy tags a fresh -latest and a per-commit sha
          # for both app and migrator), not just dangling/untagged ones —
          # without it the droplet's disk fills up over enough deploys.
          docker image prune -af
          REMOTE
